<div id="licenseOverlay"
     class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="licenseOverlayTitle">
    <section class="w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-800 p-7 text-slate-100 shadow-2xl">
        <div class="mb-5 text-center">
            <div class="flex justify-center text-indigo-300" aria-hidden="true">
                <svg class="h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            </div>
            <h1 id="licenseOverlayTitle" class="mt-3 text-2xl font-bold">NEU159 License Required</h1>
            <p class="mt-2 text-sm text-slate-300">Connect the NEU159 USB license to continue to the dashboard and configuration.</p>
        </div>
        <div id="licenseOverlayState" class="rounded-lg border border-indigo-800 bg-indigo-950 p-4 text-sm text-indigo-100" role="status" aria-live="polite">
            Checking this controller and looking for the USB license…
        </div>
        <div id="licenseOverlayDetails" class="mt-4 hidden rounded-lg border border-emerald-800 bg-emerald-950 p-4 text-sm text-emerald-100"></div>
        <details id="licenseOverlayDiagnostics" class="mt-4 hidden rounded-lg border border-slate-700 p-3 text-xs text-slate-300">
            <summary class="cursor-pointer font-semibold">USB license data read by the controller</summary>
            <pre id="licenseOverlayDiagnosticData" class="mt-2 max-h-64 overflow-auto whitespace-pre-wrap"></pre>
        </details>
        <button id="licenseOverlayRetry" type="button" autofocus
                class="mt-5 w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-60">
            Check USB license
        </button>
    </section>
</div>
<script src="{{ request.script_root }}/static/license-overlay.js" defer></script>
