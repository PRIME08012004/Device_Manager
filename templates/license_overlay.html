<div id="licenseOverlay"
     class="fixed inset-0 z-[99999] flex items-center justify-center bg-slate-950/70 p-4 backdrop-blur-sm"
     role="dialog" aria-modal="true" aria-labelledby="licenseOverlayTitle">
    <section class="w-full max-w-lg rounded-2xl bg-white p-7 text-slate-800 shadow-2xl">
        <div class="mb-5 text-center">
            <div class="text-4xl" aria-hidden="true">🔐</div>
            <h1 id="licenseOverlayTitle" class="mt-3 text-2xl font-bold">NEU159 License Required</h1>
            <p class="mt-2 text-sm text-slate-600">Connect the NEU159 USB license to continue to the dashboard and configuration.</p>
        </div>
        <div id="licenseOverlayState" class="rounded-lg bg-indigo-50 p-4 text-sm text-indigo-900" role="status" aria-live="polite">
            Checking this controller and looking for the USB license…
        </div>
        <div id="licenseOverlayDetails" class="mt-4 hidden rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-900"></div>
        <details id="licenseOverlayDiagnostics" class="mt-4 hidden rounded-lg border border-slate-200 p-3 text-xs">
            <summary class="cursor-pointer font-semibold">USB license data read by the controller</summary>
            <pre id="licenseOverlayDiagnosticData" class="mt-2 max-h-64 overflow-auto whitespace-pre-wrap"></pre>
        </details>
        <button id="licenseOverlayRetry" type="button" autofocus
                class="mt-5 w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-60">
            Check USB license
        </button>
    </section>
</div>
<script src="/static/license-overlay.js" defer></script>
