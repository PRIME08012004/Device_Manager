<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activate NEU159 License</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4 text-slate-800">
    <main class="w-full max-w-lg rounded-xl bg-white p-8 shadow-lg">
        <div class="mb-5 text-center">
            <div class="flex justify-center text-slate-700"><svg class="h-10 w-10" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <h1 class="mt-3 text-2xl font-bold">NEU159 License Required</h1>
            <p class="mt-2 text-sm text-slate-600">Connect the NEU159 USB license and we’ll activate it for this controller.</p>
        </div>
        <div id="state" class="rounded-lg bg-indigo-50 p-4 text-sm text-indigo-900" role="status" aria-live="polite">
            Looking for a license on the USB…
        </div>
        <div id="licenseDetails" class="mt-4 hidden rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-900"></div>
        <button id="retry" type="button" class="mt-5 w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-60">
            Check USB license
        </button>
        <p class="mt-4 text-xs text-slate-500">USB detection runs on the controller. Open DevTools → Network to see the license API requests.</p>
    </main>
    <script>
        const state = document.getElementById('state');
        const retry = document.getElementById('retry');
        const details = document.getElementById('licenseDetails');
        let retryTimer = null;

        async function readJson(response) {
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                throw new Error(`Server returned ${response.status} ${response.statusText} instead of JSON.`);
            }
            return response.json();
        }

        function retrySoon() {
            retry.disabled = false;
            retryTimer = window.setTimeout(checkLicense, 5000);
        }

        async function checkLicense() {
            window.clearTimeout(retryTimer);
            retry.disabled = true;
            details.classList.add('hidden');
            state.textContent = 'Checking this controller and looking for the USB license…';
            try {
                const licenseResponse = await fetch('/api/license', { cache: 'no-store' });
                const license = await readJson(licenseResponse);
                if (license.valid) {
                    window.location.replace('/dashboard');
                    return;
                }

                const statusResponse = await fetch('/api/usb/status', { cache: 'no-store' });
                const usbStatus = await readJson(statusResponse);
                state.textContent = usbStatus.message;
                if (usbStatus.state !== 'ready') {
                    retrySoon();
                    return;
                }

                const response = await fetch('/api/usb/install_license', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });
                const result = await readJson(response);
                if (!response.ok) throw new Error(result.error || 'License installation failed.');
                state.textContent = result.message;
                details.textContent = `License ${result.license.license_id || ''} · up to ${result.license.max_devices} devices. Saved to ${result.saved_to}. Opening dashboard…`;
                details.classList.remove('hidden');
                window.setTimeout(() => window.location.replace('/dashboard'), 900);
            } catch (error) {
                state.textContent = error.message || 'Could not check the USB license.';
                retrySoon();
            }
        }
        retry.addEventListener('click', checkLicense);
        checkLicense();
    </script>
</body>
</html>
